<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShowCase</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #05050a;
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
        }
        #canvas-bg{
            position: fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            z-index:0;
        }
        .container{
            position:relative;
            z-index:2;
            min-height:100vh;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            text-align:center;
        }
        h1{
            font-size:52px;
            font-weight:200;
            letter-spacing:12px;
            background: linear-gradient(90deg,#7367ff,#ff63b8,#7367ff);
            background-size:200% auto;
            -webkit-background-clip:text;
            color:transparent;
            animation: gradientFlow 4s linear infinite;
        }
        .tagline{
            margin-top:16px;
            font-size:18px;
            color:#a2a2c2;
            letter-spacing:2px;
            animation: fadeFloat 3.5s ease-in-out infinite alternate;
        }
        .links{
            margin-top:48px;
            display:flex;
            gap:20px;
        }
        .links a{
            text-decoration:none;
            color:#e2d9ff;
            padding:14px 32px;
            border:1px solid #443880;
            border-radius:50px;
            background: rgba(115,103,255,0.06);
            backdrop-filter: blur(6px);
            transition:0.4s ease;
        }
        .links a:hover{
            transform: translateY(-6px) scale(1.05);
            border-color:#948bff;
            box-shadow:0 0 24px #7367ff77;
        }
        footer{
            position:fixed;
            bottom:24px;
            z-index:2;
            font-size:13px;
            color:#5c5c80;
        }
        @keyframes gradientFlow{
            0%{background-position:0% center;}
            100%{background-position:200% center;}
        }
        @keyframes fadeFloat{
            from{opacity:0.75; transform:translateY(0px);}
            to{opacity:1; transform:translateY(-8px);}
        }
    </style>
</head>
<body>
    <canvas id="canvas-bg"></canvas>
    <div class="container">
        <h1>666ddw</h1>
        <div class="tagline">Code · Create · Explore</div>
        <div class="links">
            <a href="https://github.com/666ddw">GitHub</a>
        </div>
    </div>
    <footer>© 2026 · All Rights Reserved</footer>

    <script>
        const canvas = document.getElementById("canvas-bg");
        const ctx = canvas.getContext("2d");
        let w = canvas.width = innerWidth;
        let h = canvas.height = innerHeight;
        window.addEventListener('resize',()=>{w=canvas.width=innerWidth;h=canvas.height=innerHeight;});
        const dots = [];
        const count =130;
        for(let i=0;i<count;i++){
            dots.push({
                x:Math.random()*w,
                y:Math.random()*h,
                r:Math.random()*1.4+0.4,
                speedX:(Math.random()-0.5)*0.65,
                speedY:(Math.random()-0.5)*0.65
            })
        }
        function loop(){
            ctx.clearRect(0,0,w,h);
            for(let i=0;i<dots.length;i++){
                const d = dots[i];
                d.x += d.speedX;
                d.y += d.speedY;
                if(d.x<0||d.x>w)d.speedX*=-1;
                if(d.y<0||d.y>h)d.speedY*=-1;
                ctx.beginPath();
                ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
                ctx.fillStyle="rgba(120,110,255,0.35)";
                ctx.fill();
            }
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
